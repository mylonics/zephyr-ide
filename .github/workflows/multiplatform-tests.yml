# Combined Integration Test (All Platforms) Pipeline
#
# Runs the combined integration test on Ubuntu, Fedora, Arch Linux, Clear Linux,
# Windows, and macOS.
# This is the heavier CI that validates cross-platform compatibility before releases.
#
# For fast Ubuntu-only testing, see basic-tests.yml.
# For all workspace setup types, see workspace-setup-tests.yml.
#
# Trigger behavior:
# - PRs to develop from bump-version branches: All platforms
# - PRs with 'full_test' label: All platforms
# - Manual dispatch: All platforms

name: Combined Integration Test (All Platforms)

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check-should-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if should run
        id: check
        run: |
          # Always run for manual triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running tests"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For PRs: run if bump PR or has full_test label
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            HAS_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'full_test') }}"

            if echo "$HEAD_REF" | grep -q '^bump-version-'; then
              echo "Bump version PR detected ($HEAD_REF) - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$HAS_LABEL" = "true" ]; then
              echo "full_test label detected - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "PR ($HEAD_REF) without full_test label - skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"

  # Skip duplicate runs: if basic-tests.yml already covers this PR on Ubuntu,
  # this workflow adds Windows and macOS. For pushes it runs all three.
  multiplatform-test:
    needs: check-should-run
    if: needs.check-should-run.outputs.should_run == 'true'
    uses: ./.github/workflows/_shared-platform-test.yml
    with:
      ref: ${{ inputs.branch || '' }}
      platforms: ubuntu,fedora,arch,clr,windows,macos
