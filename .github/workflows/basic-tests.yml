# Combined Integration Test (Every PR) Pipeline
#
# Runs the combined integration test on Ubuntu, Windows, and macOS.
# This is the default CI that runs on every PR to ensure nothing is broken
# on any platform, not just Ubuntu.
#
# For all workspace setup types, see workspace-setup-tests.yml.
# multiplatform-tests.yml runs the same combined test again, gated to
# bump-version branches / the 'full_test' label — on those PRs it now
# duplicates this job; kept separate in case its gating is later changed
# to cover something this workflow doesn't.
#
# Trigger behavior:
# - PRs to develop: Always runs (all platforms)
# - Manual dispatch: Always runs (all platforms)

name: Combined Integration Test (Every PR)

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  basic-test:
    uses: ./.github/workflows/_shared-platform-test.yml
    with:
      ref: ${{ inputs.branch || '' }}
      platforms: ubuntu,windows,macos
