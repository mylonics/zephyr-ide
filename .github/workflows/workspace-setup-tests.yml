# Workspace Setup Tests
#
# This workflow runs all 5 workspace setup type tests on Ubuntu and macOS.
# Each test validates a different way to set up a Zephyr workspace:
#   - Standard:       Fresh workspace → west.yml → SDK → project → build
#   - External Zephyr: Git repo (no west) → external Zephyr installation → build
#   - West Git:       West manifest git repo → SDK → custom board build
#   - Zephyr IDE Git: Zephyr IDE sample git repo → SDK → build
#   - Local West:     Git repo with west.yml → detect local west → build
#
# Trigger behavior:
# - PRs to main/pre-release: Always runs
# - PRs to develop with 'test-all-workspaces' label: Runs
# - Push to develop when package.json version is bumped: Runs
# - Manual dispatch: Always runs
#
# For fast single-workspace CI, see basic-tests.yml.
# For multi-platform testing, see multiplatform-tests.yml.

name: Workspace Setup Tests

on:
  pull_request:
    branches: [main, pre-release, develop]
  push:
    branches: [develop]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Determine if this workflow should run
  check-should-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 2

      - name: Check if should run
        id: check
        run: |
          # Always run for manual triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running tests"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For PRs: run if targeting main/pre-release or has test-all-workspaces label
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            HAS_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'test-all-workspaces') }}"

            if [ "$BASE_REF" = "main" ] || [ "$BASE_REF" = "pre-release" ]; then
              echo "PR targets $BASE_REF - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$HAS_LABEL" = "true" ]; then
              echo "test-all-workspaces label detected - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "PR targets $BASE_REF without test-all-workspaces label - skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # For push events: only run if version was bumped
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREVIOUS_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "0.0.0")
          else
            PREVIOUS_VERSION="0.0.0"
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version bump detected: $PREVIOUS_VERSION -> $CURRENT_VERSION"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version bump detected"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  test-with-zephyr:
    needs: check-should-run
    if: needs.check-should-run.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
            xvfb: "xvfb-run -a "
            zephyr_base: /tmp/zephyr
          - os: macos-15
            platform: macos
            xvfb: ""
            zephyr_base: /tmp/zephyr
    runs-on: ${{ matrix.os }}
    name: test-workspace-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget python3-dev python3-venv python3-tk \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1 xvfb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja gperf ccache dfu-util dtc wget python3 sdl2

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run test-compile

      - name: Bundle Extension (dist)
        run: npm run esbuild

      - name: Run linting
        run: npm run lint

      - name: Run external zephyr workspace integration tests
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js external-zephyr
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}

      - name: Run standard workflow integration tests
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js standard
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}

      - name: Run west git workflow integration tests
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js west-git
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}

      - name: Run zephyr ide git workspace integration tests
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js zephyr-ide-git
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}

      - name: Run local west workspace integration tests
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js local-west
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}
