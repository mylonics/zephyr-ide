# Workspace Setup Tests
#
# This workflow runs all 5 workspace setup type tests on Ubuntu and macOS.
# Each test validates a different way to set up a Zephyr workspace:
#   - Standard:       Fresh workspace → west.yml → SDK → project → build
#   - External Zephyr: Git repo (no west) → external Zephyr installation → build
#   - West Git:       West manifest git repo → SDK → custom board build
#   - Zephyr IDE Git: Zephyr IDE sample git repo → SDK → build
#   - Local West:     Git repo with west.yml → detect local west → build
#
# Trigger behavior:
# - PRs to develop from bump-version branches: Always runs
# - PRs to develop with 'full_test' label: Runs
# - Manual dispatch: Always runs
#
# For fast single-workspace CI, see basic-tests.yml.
# For multi-platform testing, see multiplatform-tests.yml.

name: Workspace Setup Tests

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Determine if this workflow should run
  check-should-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if should run
        id: check
        run: |
          # Always run for manual triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running tests"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For PRs: run if bump PR or has full_test label
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            HAS_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'full_test') }}"

            if echo "$HEAD_REF" | grep -q '^bump-version-'; then
              echo "Bump version PR detected ($HEAD_REF) - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$HAS_LABEL" = "true" ]; then
              echo "full_test label detected - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "PR ($HEAD_REF) without full_test label - skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"

  test-with-zephyr:
    needs: check-should-run
    if: needs.check-should-run.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
            xvfb: "xvfb-run -a "
            zephyr_base: /tmp/zephyr
          - os: macos-15
            platform: macos
            xvfb: ""
            zephyr_base: /tmp/zephyr
    runs-on: ${{ matrix.os }}
    name: test-workspace-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget python3-dev python3-venv python3-tk \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1 xvfb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja gperf ccache dfu-util dtc wget python3 sdl2

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run test-compile

      - name: Bundle Extension (dist)
        run: npm run esbuild

      - name: Run linting
        run: npm run lint

      - name: Run external zephyr workspace tests
        id: test_external
        continue-on-error: true
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js external-zephyr
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run standard workspace tests
        id: test_standard
        continue-on-error: true
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js standard
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run west git workspace tests
        id: test_west_git
        continue-on-error: true
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js west-git
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run zephyr ide git workspace tests
        id: test_zephyr_ide_git
        continue-on-error: true
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js zephyr-ide-git
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run local west workspace tests
        id: test_local_west
        continue-on-error: true
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js local-west
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check test results
        if: always()
        run: |
          echo "external-zephyr: ${{ steps.test_external.outcome }}"
          echo "standard:        ${{ steps.test_standard.outcome }}"
          echo "west-git:        ${{ steps.test_west_git.outcome }}"
          echo "zephyr-ide-git:  ${{ steps.test_zephyr_ide_git.outcome }}"
          echo "local-west:      ${{ steps.test_local_west.outcome }}"

          if [ "${{ steps.test_external.outcome }}"      != "success" ] || \
             [ "${{ steps.test_standard.outcome }}"      != "success" ] || \
             [ "${{ steps.test_west_git.outcome }}"      != "success" ] || \
             [ "${{ steps.test_zephyr_ide_git.outcome }}" != "success" ] || \
             [ "${{ steps.test_local_west.outcome }}"    != "success" ]; then
            echo "One or more tests failed."
            exit 1
          fi
          echo "All tests passed."
