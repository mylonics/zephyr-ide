# Workspace Setup Tests
#
# Runs each of the 5 workspace setup types as its own parallel job across
# Ubuntu, macOS, and Windows (15 jobs total: 3 platforms x 5 types). Each
# type validates a different way to set up a Zephyr workspace:
#   - Standard:       Fresh workspace → west.yml → SDK → project → build
#   - External Zephyr: Git repo (no west) → external Zephyr installation → build
#   - West Git:       West manifest git repo → SDK → custom board build
#   - Zephyr IDE Git: Zephyr IDE sample git repo → SDK → build
#   - Local West:     Git repo with west.yml → detect local west → build
#
# Splitting by type (rather than 5 sequential steps in one job, as before)
# gives each type its own status in the PR checks UI and cuts wall-clock
# time roughly 5x, at the cost of more total runner-minutes (system deps,
# npm ci, compile/bundle/lint, and the Zephyr SDK download are now repeated
# per type instead of shared across one job's sequential steps). The Zephyr
# SDK toolchain download is cached (keyed by OS + SDK version) to claw back
# most of that added cost — see the "Cache Zephyr SDK toolchains" step.
#
# West/git module checkouts are deliberately NOT cached: the 5 types use
# different manifests (different HAL allowlists, some cloned from a sample
# repo instead of using the SDK-selector templates), so a shared cache key
# risks silently restoring modules that don't match what a given type's
# manifest expects. The SDK toolchain download is the one artifact that's
# byte-identical across all 5 types on a given platform, which is what makes
# it safe and high-value to cache.
#
# Trigger behavior:
# - PRs to develop from bump-version branches: Always runs
# - PRs to develop with 'full_test' label: Runs
# - Manual dispatch: Always runs
#
# For fast single-workspace CI (all 3 platforms), see basic-tests.yml.

name: Workspace Setup Tests

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # Single source of truth for the SDK version under test — read by
  # test-runner.ts's getTestEnvConfig() as a fallback default, and by the
  # cache key below. Keeping it in one place means the two can never drift.
  ZEPHYR_IDE_TEST_SDK_VERSION: v4.4.0

jobs:
  # Determine if this workflow should run now.
  check-should-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if should run
        id: check
        run: |
          # Always run for manual triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running tests"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For PRs: run if bump PR or has full_test label
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            HAS_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'full_test') }}"

            if echo "$HEAD_REF" | grep -q '^bump-version-'; then
              echo "Bump version PR detected ($HEAD_REF) - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$HAS_LABEL" = "true" ]; then
              echo "full_test label detected - running tests"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "PR ($HEAD_REF) without full_test label - skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"

  test-with-zephyr:
    needs: check-should-run
    if: needs.check-should-run.outputs.should_run == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, macos, windows]
        test_type: [standard, external-zephyr, west-git, zephyr-ide-git, local-west]
        include:
          - platform: ubuntu
            os: ubuntu-latest
            xvfb: "xvfb-run -a "
            zephyr_base: /tmp/zephyr
          - platform: macos
            os: macos-26
            xvfb: ""
            zephyr_base: /tmp/zephyr
          - platform: windows
            os: windows-latest
            xvfb: ""
            zephyr_base: D:\\zephyr
    runs-on: ${{ matrix.os }}
    name: test-workspace-${{ matrix.platform }}-${{ matrix.test_type }}

    # HOMEBREW_NO_AUTO_UPDATE / HOMEBREW_NO_INSTALL_CLEANUP: without these,
    # "Install system dependencies (macOS)" below (and any package the test
    # itself installs on demand) can implicitly trigger `brew update`, which
    # re-syncs the homebrew-core/homebrew-cask taps and can take many minutes
    # (or appear to hang) on GitHub-hosted macOS runners. Harmless no-op on
    # Ubuntu/Windows runners where brew isn't invoked.
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      # Keyed on OS + SDK version only (not test_type or a source hash), since
      # all 5 types on a given platform download the identical SDK toolchain
      # archive to the same ~/.zephyr_ide/toolchains directory
      # (resolveToolchainDirPath()'s default in src/setup_utilities/workspace-config.ts).
      # First job per platform to finish populates the cache; the other 4
      # (running in parallel) won't see it until their own run, but every
      # subsequent workflow run on this platform hits a warm cache.
      - name: Cache Zephyr SDK toolchains
        uses: actions/cache@v4
        with:
          path: ~/.zephyr_ide/toolchains
          key: zephyr-sdk-${{ runner.os }}-${{ env.ZEPHYR_IDE_TEST_SDK_VERSION }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget python3-dev python3-venv python3-tk \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1 xvfb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja gperf ccache dfu-util dtc wget python3 sdl2

      # Windows runners: move TEMP/TMP to the D: drive (more space than C:).
      # SDK downloads, 7z extraction, and venv creation use this path.
      - name: Set TEMP to D drive (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path 'D:\Temp'
          echo 'TEMP=D:\Temp' >> $env:GITHUB_ENV
          echo 'TMP=D:\Temp'  >> $env:GITHUB_ENV
        shell: pwsh

      # 7-Zip is pre-installed on Windows runners but not always on PATH.
      # Adding it ensures west/SDK operations that shell out to 7z work.
      - name: Add 7-Zip to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run test-compile

      - name: Bundle Extension (dist)
        run: npm run esbuild

      - name: Run linting
        run: npm run lint

      - name: Run ${{ matrix.test_type }} workspace tests
        run: |
          ${{ matrix.xvfb }}node scripts/run-integration-tests.js ${{ matrix.test_type }}
        env:
          NODE_ENV: test
          ZEPHYR_BASE: ${{ matrix.zephyr_base }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_COMPILE: true

      # JUnit XML and captured extension debug output logs, written to
      # test-results/ by the test run regardless of pass/fail. if: always()
      # so a failing run still leaves these downloadable instead of only
      # existing in the raw job log.
      - name: Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-results-${{ matrix.platform }}-${{ matrix.test_type }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
