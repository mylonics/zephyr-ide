# Unit Tests Pipeline
#
# Runs lightweight unit tests that validate utility functions, configuration
# parsing, platform detection, and other logic that does not require a Zephyr
# SDK or workspace setup.
#
# These tests run inside a VS Code extension host but do not perform any
# network-heavy or build-heavy operations, so they complete in under a minute.
#
# Trigger behavior:
# - PRs to develop: Always runs
# - Manual dispatch: Always runs
#
# For integration/workspace tests, see basic-tests.yml and workspace-setup-tests.yml.

name: Unit Tests

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # For pull_request events github.ref resolves to refs/pull/NNN/merge,
          # a virtual ref that disappears once the PR is merged.  Using the
          # head SHA instead gives us a stable, always-available commit ref.
          # For workflow_dispatch with an explicit branch input we honour that.
          # For any other trigger (push, schedule, …) github.sha is stable.
          ref: ${{ inputs.branch || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run test-compile

      - name: Bundle Extension
        run: npm run esbuild

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        # Runs the `unit` labeled configuration from .vscode-test.mjs, which
        # is every compiled test file except the heavyweight integration
        # suites (workspace-*.test.ts, combined-installation.test.ts). Those
        # are exercised by basic-tests.yml and workspace-setup-tests.yml
        # instead. Selection is by explicit file list, not by suite title, so
        # newly added unit test files are never silently excluded here.
        run: |
          xvfb-run -a npx vscode-test --label unit
